name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds, exhausting the shared rate limit and failing a job
      # before any test runs. Pinning also stops CI drifting ahead of local.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start Supabase local development setup
        run: supabase start --exclude storage-api,imgproxy,logflare,supavisor,vector

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres" > src/data/database.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/data/database.ts; then
            echo "Detected uncommitted changes to generated types. Run 'npm run types' and commit:"
            git diff src/data/database.ts
            exit 1
          fi

      # ARCHITECTURE.md calls supabase/schemas/ authoritative, and DESIGN.md links
      # readers there. That claim has to be enforced or it decays: four RPCs, three
      # submissions columns, two check constraints, a unique index and the trigger
      # that creates scholars at all had each been added by migration and never
      # mirrored, so the "authoritative" description of the schema was materially
      # wrong for months.
      #
      # It is not only a documentation problem. A restore applies the schema from
      # migrations and RECOVERY.md points at schemas/ to explain what should be
      # there — a schema file that lies is a restore that goes wrong under pressure.
      #
      # `supabase db diff` reports the DDL needed to make the migrations match the
      # declarative files. Agreement means empty output.
      - name: Verify declarative schemas match the migrations
        run: |
          set -euo pipefail
          supabase db diff --schema public > /tmp/drift.out 2>/tmp/drift.err || {
            echo "::error::supabase db diff failed — schemas/ may not be applicable at all"
            cat /tmp/drift.err; exit 1;
          }
          # The CLI emits a JSON object on stdout whose `diff` key holds the DDL.
          # Grepping the raw output for '^create|^alter' finds nothing, because the
          # statements are escaped inside a single JSON line — which is exactly how
          # a first version of this check reported "no drift" against a schema that
          # had plainly drifted. Parse it.
          grep -o '{"diff".*}' /tmp/drift.out | jq -r '.diff // ""' > /tmp/drift.sql
          if [ -n "$(tr -d '[:space:]' < /tmp/drift.sql)" ]; then
            echo "::error::supabase/schemas/ has drifted from supabase/migrations/."
            echo "The statements below are what the migrations contain and the schema files do not."
            echo "Update the matching file in supabase/schemas/ so it describes the real schema."
            echo
            cat /tmp/drift.sql
            exit 1
          fi
          echo "schemas/ and migrations/ agree"
