# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Locale validation

on:
  # Run as its own check on pull requests. Neither this suite nor the locale
  # check needs Supabase or a browser, so gating PRs on them costs a minute and
  # is what makes a new test actually able to block a regression — before this,
  # vitest ran only on the push to dev, i.e. after review had already passed.
  pull_request:
  # Allow the deploy workflows to call it,
  workflow_call:
  # and allow manual runs.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
        name: Install dependencies
      - run: npm run sync
        name: Sync SvelteKit
      - run: npm run locale
        name: Regenerate schema and run locale validation
