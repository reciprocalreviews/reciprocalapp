# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "reciprocalapp"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` is always included.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request. `public` is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
enabled = false

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://localhost:5173"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# /auth/callback is where the app exchanges the ORCID OIDC code for a session (see
# src/routes/auth/callback/+server.ts).
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/callback"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in. Kept OFF:
# scholars authenticate with ORCID (which carries no email), and contact-email
# verification is handled entirely in the app (#27, public.verify_email) — GoTrue's
# email confirmation is never used, so with ORCID-only sign-in GoTrue sends no auth mail.
enable_confirmations = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"

# Production SMTP. We route auth emails through Resend so they use the same
# provider and sender (notifications@reciprocal.reviews) as our application
# emails (see supabase/functions/resend). This is configured for the hosted
# staging/prod projects in the Supabase Dashboard (Auth → SMTP). It is kept here
# as documentation but DISABLED (enabled = false) so local development keeps
# routing auth email to Mailpit ([local_smtp] above) — a custom SMTP host would
# otherwise make the local stack send real mail through Resend, breaking local
# login and the Playwright tests.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "notifications@reciprocal.reviews"
sender_name = "Reciprocal Reviews"

# Branded auth email templates (English only; we can't yet solicit a scholar's
# language preference). These are mirrored from the shared shell in
# supabase/functions/_shared/emailShell.ts. NOTE: for the hosted project, these
# customizations must be copied into the Supabase Dashboard (Auth → Email
# Templates) — config.toml templates apply to local development only.
[auth.email.template.magic_link]
subject = "Your Reciprocal Reviews sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email for Reciprocal Reviews"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Reciprocal Reviews password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Reciprocal Reviews"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You've been invited to Reciprocal Reviews"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Reciprocal Reviews verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }} ."
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# ORCID sign-in (#19) uses a Supabase CUSTOM OIDC provider, configured only in the hosted
# Dashboard: Authentication → Providers → New Provider → Auto-discovery (OIDC), with
# identifier "custom:orcid" (Supabase requires the "custom:" prefix — a bare "orcid" is
# rejected), the bare issuer URL https://orcid.org (staging uses https://sandbox.orcid.org;
# the discovery document is resolved automatically), scope "openid", and
# email_optional = true — ORCID releases no email, so without that flag user creation fails.
# config.toml cannot express a custom OIDC provider, so local dev + CI do NOT use ORCID:
# they sign in with a local-only email/password grant against seeded users (see the dev form
# in src/routes/[[lang]]/login/+page.svelte and src/routes/login.ts). Real ORCID auth is
# verified in hosted staging against the ORCID sandbox.

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false

[edge_runtime]
enabled = true
# Configure one of the supported request policies: `oneshot`, `per_worker`.
# Use `oneshot` for hot reload, or `per_worker` for load testing.
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

[db.vault]
# WARNING: `supabase db push` COPIES THESE SECRETS TO THE REMOTE PROJECT, and there is no
# flag to disable it (supabase/cli#3815). Anything given a LITERAL value here silently
# overwrites the hosted project's real secret on every deploy. That is not hypothetical: a
# literal `site_url` here reset staging to localhost after each deploy, so verification
# links were built pointing at a machine nobody else can reach.
#
# Every entry must therefore use env(...), and those variables must be unset in deploy
# environments. The migrate job has no .env, so these resolve to empty and the CLI leaves
# the hosted values alone. Hosted projects set their own values by hand in the Dashboard
# (Project Settings → Vault); nothing in this file manages them.
#
# Corollary: never run `supabase db push` against a hosted project from a shell where these
# variables are set — it would push your local values over theirs.
supabase_url = "env(PUBLIC_SUPABASE_URL)"
# Used by public.send_email() and the remind-daily cron job to call the edge functions
# below. It must be a SECRET key, never the publishable/anon key: those are public, and the
# functions authorize by checking that the caller presented one of the project's secret
# keys (supabase/functions/_shared/auth.ts). Either key format works — a legacy
# `service_role` JWT or a newer `sb_secret_...` — so this can be migrated without a flag
# day. In hosted projects this vault secret has to be added by hand; this block seeds local
# development only.
secret_key = "env(EDGE_SECRET_KEY)"
# The app origin, used by public.request_email_verification to build verification links
# (#27). Deliberately NOT taken from the caller: a caller-supplied origin would let anyone
# send a genuine-looking branded email pointing at a host they control. Hosted projects set
# this vault secret by hand to their own origin; LOCAL_SITE_URL seeds local development
# only (see the warning above about literals).
site_url = "env(LOCAL_SITE_URL)"

# Both functions are called only by the database (a trigger and a cron job), never from a
# browser. verify_jwt is OFF deliberately: the platform gate only understands JWT-shaped
# credentials, so it REJECTS the newer `sb_secret_...` API keys outright — leaving it on
# would break these callers the moment the project migrates key formats. Authorization is
# therefore done in the handlers, which require the caller to present one of the project's
# secret keys (supabase/functions/_shared/auth.ts) and fail closed if none is configured.
# That check is strictly narrower than verify_jwt was: verify_jwt accepted ANY valid
# project JWT, including the public anon key.
[functions.resend]
enabled = true
verify_jwt = false
entrypoint = "./functions/resend/index.ts"

[functions.remind]
enabled = true
verify_jwt = false
import_map = "./functions/remind/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/remind/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/remind/*.html" ]

[db.migrations]
schema_paths = [
    # Dependency order: a file may only reference tables declared above it.
    # preference_levels precedes assignments (which has an FK to it), and
    # audit_log/reconciliations come last because their triggers attach to
    # every table above. The trailing glob catches anything not listed.
    "./schemas/scholars.sql",
    "./schemas/currencies.sql",
    "./schemas/exchanges.sql",
    "./schemas/venues.sql",
    "./schemas/roles.sql",
    "./schemas/preference_levels.sql",
    "./schemas/volunteers.sql",
    "./schemas/proposals.sql",
    "./schemas/supporters.sql",
    "./schemas/tokens.sql",
    "./schemas/transactions.sql",
    "./schemas/token_events.sql",
    "./schemas/submission_types.sql",
    "./schemas/compensation.sql",
    "./schemas/submissions.sql",
    "./schemas/assignments.sql",
    "./schemas/conflicts.sql",
    "./schemas/thanks.sql",
    "./schemas/emails.sql",
    "./schemas/email_verifications.sql",
    "./schemas/audit_log.sql",
    "./schemas/reconciliations.sql",
    "./schemas/*.sql"
]