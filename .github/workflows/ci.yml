name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds, exhausting the shared rate limit and failing a job
      # before any test runs. Pinning also stops CI drifting ahead of local.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start Supabase local development setup
        run: supabase start --exclude storage-api,imgproxy,logflare,supavisor,vector

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres" > src/data/database.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/data/database.ts; then
            echo "Detected uncommitted changes to generated types. Run 'npm run types' and commit:"
            git diff src/data/database.ts
            exit 1
          fi
