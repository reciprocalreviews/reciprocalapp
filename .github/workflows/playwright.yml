name: Playwright
on:
  # Run as its own check on pull requests. This suite is the expensive one — four
  # runners, a Supabase stack and a browser each — which is why it long ran only
  # on the push that deploys, unlike vitest, the locale check and the RLS tests.
  # That gap is not free either: it makes the deploy the first execution of any
  # end-to-end change, so a regression surfaces after review, on main, at the
  # moment it blocks a release. It did exactly that when a `$lib` import in the
  # Playwright helper — which no local run could fail on, because every developer
  # machine has a warm `.svelte-kit/` — collected zero tests on all four shards
  # and stopped the production deploy. A check that only runs after merge cannot
  # block the merge, and this suite is the one that had the most to say.
  pull_request:
  # Allow the deploy workflows to call it,
  workflow_call:
    secrets:
      TEST_ENV:
        required: true
        description: 'Environment variables for testing, in the format of KEY=VALUE pairs, separated by newlines.'
  # and allow manual runs.
  workflow_dispatch:

# Supersede a PR's own in-flight run when it is pushed to again: at four runners
# a shard, stacking revisions is the difference between this being affordable and
# not. Deliberately scoped to pull requests — a deploy run must never be cancelled
# by a later push, because `migrate` and `vercel` are gated on it finishing.
concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The number of shards the suite is split across. Keep the matrix below and the
# `--shard=i/N` denominator in sync with this by editing both. Each shard runs on
# its own runner with its own fresh Supabase, so shards never contend for the DB.
# The practical floor is ~(per-runner setup) + (the single slowest test file),
# since sharding splits by whole file — beyond that, more shards just burn runner
# minutes. With tests at ~70s/shard the per-runner setup dominates, so 4 shards
# lands at ~the same wall-clock as 6 for two fewer runners.
env:
  SHARD_TOTAL: 4

jobs:
  test:
    # Skipped on pull requests from forks, which CONTRIBUTING.md asks outside
    # contributors to open. GitHub withholds secrets from a fork's
    # `pull_request` run, so `TEST_ENV` would arrive empty, the build would go up
    # without a Supabase URL or key, and every test would fail for a reason that
    # has nothing to do with the change — a red check the contributor has no way
    # to fix. Skipping says nothing rather than something false; the suite still
    # covers the code when the PR is merged to `dev` and staging.yml calls this
    # workflow. `pull_request_target` would supply the secrets, and is exactly
    # the wrong tool: it would hand them to unreviewed code from a stranger.
    #
    # Closing the gap properly means not needing the secret at all. The suite
    # runs entirely against a local Supabase, whose URL and publishable key are
    # the same well-known local-stack values on every machine — nothing secret.
    # Committing those as a test-only default, and keeping TEST_ENV for the
    # deploy path, would let forks run the suite too. Worth doing; it needs
    # someone to confirm what TEST_ENV actually holds first.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other shards if one fails — we want the full picture.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds (4 shards x 2 runs, plus migrate/rls/ci),
      # exhausting the shared rate limit and failing a shard before any test runs
      # — which `retries` cannot recover, since it never reached Playwright.
      # Pinning also stops CI drifting ahead of local.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - name: Install dependencies
        run: npm ci
      - name: Define environment variables for build.
        run: echo "${{ secrets.TEST_ENV }}" > .env
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Cache the Supabase Docker images. A cold `supabase start` pulls ~3-5 min
      # of images before the suite can run; restoring them from cache removes
      # that from every shard's critical path. Keyed by config.toml (which pins
      # the service image versions) so a version bump busts the cache.
      - name: Cache Supabase Docker images
        uses: actions/cache@v5
        id: supabase-images
        with:
          path: ~/supabase-images
          # `-v2` salt: the excluded-service set changed (studio, postgres-meta),
          # so bust the old cache and re-save the smaller image tarball.
          key: supabase-images-v2-${{ hashFiles('supabase/config.toml') }}
      - name: Load cached Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: |
          if [ -f ~/supabase-images/images.tar ]; then docker load -i ~/supabase-images/images.tar; fi
      - name: Snapshot baseline Docker images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        # Record repo:tag (not image IDs) — `docker save`/`load` only round-trips
        # the tags that `supabase start` looks images up by.
        run: docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | sort -u > /tmp/baseline-images.txt
      - name: Run Playwright tests (sharded)
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
      # On a cache miss, save just the images `supabase start` pulled during the
      # test run (diff against the baseline) so the cache action persists them.
      - name: Save Supabase images for cache
        if: ${{ always() && steps.supabase-images.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/supabase-images
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | sort -u > /tmp/after-images.txt
          comm -13 /tmp/baseline-images.txt /tmp/after-images.txt > /tmp/new-images.txt || true
          if [ -s /tmp/new-images.txt ]; then
            docker save $(cat /tmp/new-images.txt) -o ~/supabase-images/images.tar
          fi
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    # Only stitch the shard blobs into one HTML report when a shard actually
    # failed — that's the only time anyone opens it. Each shard already uploads
    # its raw blob-report-* artifact unconditionally, so a green run loses
    # nothing (run `npx playwright merge-reports ./blob-report-*` locally if
    # ever needed), and the ~17s stops taxing every successful deploy.
    if: ${{ failure() }}
    needs: [test]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download blob reports from all shards
        uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge blobs into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
