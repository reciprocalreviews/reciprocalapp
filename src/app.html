<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- The SVG is the real icon; the PNG is the fallback for browsers that predate
		     `type="image/svg+xml"` support, and iOS ignores SVG touch icons entirely. -->
		<link rel="icon" href="%sveltekit.assets%/brand/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon.png" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<meta name="theme-color" content="#007284" />

		<!-- Defaults for a link to any page. Per-page <title> is set by Page.svelte;
		     these describe the platform, which is what a shared link is announcing.
		     og:image must be a raster — Slack, LinkedIn, and iMessage all reject SVG. -->
		<meta
			name="description"
			content="Reciprocal Reviews makes peer review count: editors price submissions in review tokens, and authors earn them by reviewing."
		/>
		<meta property="og:site_name" content="Reciprocal Reviews" />
		<meta property="og:title" content="Reciprocal Reviews" />
		<meta
			property="og:description"
			content="Make peer review count. Editors price submissions in review tokens, and authors earn them by reviewing."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://reciprocal.reviews" />
		<meta property="og:image" content="https://reciprocal.reviews/brand/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />

		%sveltekit.head%

		<!-- The two faces that always load: the body face, and the latin subset of the
		     heading face. Both are discovered only after the inline CSS below parses, so
		     preloading starts them a round trip earlier. `crossorigin` is required even
		     though these are same-origin — fonts are fetched in CORS mode, and without it
		     the preload is discarded and the file fetched twice. The italic Josefin and
		     the other two Quicksand subsets are conditional, so they are not preloaded. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/Josefin/JosefinSansVariable.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/Quicksand/Quicksand500-3.woff2"
			crossorigin
		/>

		<!-- Noto Emoji (in the body stack below) and Noto Sans Mono (for `code`) are the
		     only faces not self-hosted, and this was the page's one render-blocking
		     third-party resource: nothing painted until DNS, TLS, and the fetch against
		     fonts.googleapis.com all completed. `media="print"` makes it non-blocking, and
		     the onload promotes it once it has arrived. The URL already asks for
		     `display=swap`, so text renders in the fallback and swaps, exactly as the
		     self-hosted faces do. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@300..700&family=Noto+Sans+Mono:wght@100..900&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@300..700&family=Noto+Sans+Mono:wght@100..900&display=swap"
				rel="stylesheet"
			/>
		</noscript>

		<style global>
			/* vietnamese */
			@font-face {
				font-family: 'Quicksand';
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url(/fonts/Quicksand/Quicksand500-1.woff2) format('woff2');
				unicode-range:
					U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
					U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
			}
			/* latin-ext */
			@font-face {
				font-family: 'Quicksand';
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url(/fonts/Quicksand/Quicksand500-2.woff2) format('woff2');
				unicode-range:
					U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
					U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			/* latin */
			@font-face {
				font-family: 'Quicksand';
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url(/fonts/Quicksand/Quicksand500-3.woff2) format('woff2');
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
					U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
					U+FFFD;
			}

			@font-face {
				font-family: 'Josefin Sans';
				font-style: normal;
				font-weight: 100 700;
				font-display: swap;
				src: url(/fonts/Josefin/JosefinSansVariable.woff2) format('woff2');
			}
			@font-face {
				font-family: 'Josefin Sans';
				font-style: italic;
				font-weight: 100 700;
				font-display: swap;
				src: url(/fonts/Josefin/JosefinSansItalicVariable.woff2) format('woff2');
			}

			:root {
				--font-face: 'Josefin Sans', sans-serif;
				--header-font-size: 28pt;
				--subheader-font-size: 20pt;
				--subsubheader-font-size: 16pt;
				--paragraph-font-size: 14pt;
				--small-font-size: 12pt;
				--extra-small-font-size: 10pt;
				--background-color: white;
				--text-color: black;
				--salient-color: #007284;
				--salient-color-faded: #e1eff2;
				--focus-color: #db501e;
				/* Companion tint for the focus colour, so a warning can be shown in
				   the same bordered/tinted idiom as an error rather than only as the
				   solid bar Banner uses. */
				--focus-color-faded: #fde9e1;
				--error-color: #840054;
				--error-color-faded: #ffdceb;
				--border-color: #bbbbbb;
				--border-width: 1px;
				--alternating-color: #f3f3f3;
				--inactive-color: #888888;
				--spacing: 1rem;
				--spacing-twice: 2rem;
				--spacing-half: 0.5rem;
				--roundedness: 0.25rem;
				--thick-border-width: 4px;
				--page-width: 45rem;
			}

			/*
			 * Two sticky bands overlay whatever the page scrolls under them: the nav in
			 * `Nav.svelte`, and the page title block in `Page.svelte` that pins directly
			 * below it. Reserve both on the scrollport so anything scrolled to — an anchor
			 * beside a heading, or an element a test or the browser scrolls into view —
			 * lands in the visible band beneath them rather than underneath.
			 *
			 * Both heights are measured at runtime by the `measure` action and written
			 * here, because each varies: the nav with how many banners are up and whether
			 * its row wraps, the title block with the length of the title and whether the
			 * page supplies a subtitle or details. The fallbacks are typical values, used
			 * for the first paint before the observers report and whenever script is off.
			 *
			 * The end value is 0: the footer is in normal flow and covers nothing.
			 */
			html {
				scroll-padding-block-start: calc(var(--nav-height, 8rem) + var(--page-header-height, 6rem));
				scroll-padding-block-end: 0;
			}

			body {
				background: var(--background-color);
				color: var(--text-color);
				font-size: var(--paragraph-font-size);
				font-family: var(--font-face), 'Noto Emoji', sans-serif;
				font-weight: 300;
				padding: 0;
				margin: 0;
				line-height: 1.4;

				/* A column at least as tall as the viewport, so `main` can absorb the slack
				   and the footer is carried to the bottom instead of ending up mid-screen on
				   a short page (#156). `dvh` rather than `svh`/`lvh` because it tracks the
				   viewport as a mobile URL bar hides — which is the moment the footer was
				   reported detaching. The body's app wrapper is `display: contents`, so
				   header/main/footer are the flex items here. */
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
			}

			strong,
			b {
				font-weight: 600;
			}

			a {
				color: var(--salient-color);
				font-weight: 400;
				text-decoration: underline var(--salient-color) var(--thick-border-width) solid;
				text-decoration-skip-ink: none;
				white-space: wrap;
				font-size: inherit;
			}

			a:hover:not([aria-current]) {
				text-decoration: underline;
				text-decoration-thickness: calc(1.25 * var(--thick-border-width));
			}

			h1,
			h2,
			h3 {
				font-family: 'Quicksand', sans-serif;
				font-weight: 500;
				/* Calibrated for this specific font. Update if you update the font. */
				line-height: 1.1;
				margin-bottom: 0;
			}

			h1 {
				font-size: var(--header-font-size);
				background: var(--salient-color);
				color: var(--background-color);
				padding: var(--spacing);
				border-radius: 0 0 var(--roundedness) var(--roundedness);
				margin-top: 0;
				display: flex;
				flex-direction: row;
				gap: var(--spacing);
			}

			h2 {
				font-size: var(--subheader-font-size);
				border-bottom: var(--border-color) solid var(--thick-border-width);
				margin-top: 0;
				margin-block-start: 0;
				margin-block-end: 0;
				text-transform: initial;
			}

			h2:first-child {
				margin-block-start: 0;
			}

			h3 {
				font-size: var(--subsubheader-font-size);
				font-style: italic;
				margin-block-start: 0em;
			}

			h3:first-child,
			h2 + h3 {
				margin-block-start: 0;
			}

			li {
				margin-block-end: 0.5em;
			}

			p {
				margin: 0;
				line-height: 1.5;
			}

			p:last-child {
				margin-block-end: 0;
			}

			/* The review token chip. Global rather than scoped to Tokens.svelte because the
			   same markup is also produced as an HTML string by tokenChip() and rendered
			   through `{@html}`, which Svelte's style scoping does not reach. */
			.token {
				font-weight: 500;
				font-size: var(--small-font-size);
				padding: var(--spacing-half);
				border-radius: var(--roundedness);
				background-color: var(--salient-color-faded);
				/* The chip wraps, so each line gets its own background and padding rather
				   than one box straddling the break. */
				box-decoration-break: clone;
				/* The chip may wrap, because the currency name inside it is venue-authored
				   and can be long: "★ 25 Computing Education Tokens" held on one line sets a
				   minimum width that a table column then has to find room for, and the
				   transactions table is already the widest thing on the platform. Only the
				   star and the amount are held together, below — they are one value, and
				   wrapping between them reads as two. The unit word is free to follow the
				   name, since the name already separates it from the amount. */
				white-space: normal;
			}

			/* The star and the amount: never split. */
			.token .value {
				white-space: nowrap;
			}

			.token .star {
				color: var(--salient-color);
			}

			.token .currency {
				font-weight: 300;
			}

			.token.debit {
				background-color: var(--error-color-faded);
			}

			.token.debit .star {
				color: var(--error-color);
			}

			code {
				font-size: 11pt;
				font-family: 'Noto Sans Mono', monospace;
				font-weight: 400;
				font-style: normal;
				background: var(--alternating-color);
				padding: 0 calc(var(--spacing) / 4) 0 calc(var(--spacing) / 4);
				border-radius: var(--roundedness);
			}

			ul,
			ol {
				margin: 0;
				padding-inline-start: 1em;
			}

			table {
				width: 100%;
			}

			td,
			th {
				text-align: left;
				padding: var(--spacing);
				font-size: var(--small-font-size);
			}

			th {
				font-weight: 300;
				padding-bottom: 0;
				vertical-align: bottom;
				font-style: italic;
			}

			label {
				position: relative;
				font-style: normal;
				display: flex;
				flex-direction: column;
			}

			hr {
				border: none;
				border-top: var(--border-color) solid var(--border-width);
				width: 100%;
				margin: 0;
			}

			fieldset {
				display: flex;
				flex-direction: row;
				border: none;
				padding: 0;
				gap: var(--spacing);
			}

			legend {
				font-style: italic;
			}

			/* Between the HTML arriving and the app mounting, every button below is drawn but
			   wired to nothing, and a click is dropped without a trace. The class is removed by
			   the root layout the moment handlers exist (see +layout.svelte); until then the
			   cursor says "wait" rather than "press". */
			body.hydrating button {
				cursor: progress;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover" class="hydrating">
		<!--
			The last resort, and deliberately outside Svelte.

			A component that throws while the page is hydrating takes the whole root mount down with
			it, and leaves the reader whatever the server sent: a page that is drawn, styled, and
			wired to nothing. Every button is dead, the browser still depresses them because :active
			is CSS, and nobody is told anything at all. A scholar lost a working profile page that way
			and spent weeks clicking a button that could not possibly respond.

			Two things were tried before this and are recorded so they are not tried again. A
			<svelte:boundary> around the page does not work: when it catches a throw during HYDRATION
			it discards the half-hydrated DOM and renders its fallback into nothing, emptying the
			document. Nor can this reveal a notice the server rendered, for the same reason — the
			failure can take that notice with it. So the element is BUILT here, out of nothing, by
			code that has already run by the time anything can go wrong.

			The class below is removed by the root layout on mount. If it is still here ten seconds
			later the app never mounted, and ten seconds is long enough that a slow connection still
			working is never accused of having failed.

			The English is hardcoded, which is the one thing here that is not how this app does
			things. It has to be: the locale arrives through Svelte, and the whole point of this
			notice is that it is shown when Svelte is what broke. English is the only locale today,
			and a sentence the reader can act on beats a correct system that says nothing.
		-->
		<script>
			setTimeout(function () {
				if (!document.body.classList.contains('hydrating')) return;
				var notice = document.createElement('div');
				notice.id = 'hydration-failed';
				notice.setAttribute('data-testid', 'hydration-failed');
				notice.setAttribute('role', 'alert');
				// The same tokens the rest of the page uses, which are defined in the style block
				// above rather than by Svelte — so they are available even now.
				notice.style.cssText =
					'position:fixed;inset-block-start:0;inset-inline:0;z-index:100;text-align:center;' +
					'padding:var(--spacing);background:var(--error-color-faded);color:var(--error-color);' +
					'border-block-end:var(--thick-border-width, 3px) solid var(--error-color)';
				notice.textContent =
					'This page did not finish loading, so its buttons will not respond. Reload the page, and write to stewards@reciprocal.reviews if it keeps happening.';
				document.body.appendChild(notice);
			}, 10000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
