name: Deploy to Production

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  unit-tests:
    uses: ./.github/workflows/vitest.yml

  locale-validation:
    uses: ./.github/workflows/locales.yml

  playwright:
    uses: ./.github/workflows/playwright.yml
    secrets:
      TEST_ENV: ${{ secrets.TEST_ENV }}

  rls-tests:
    uses: ./.github/workflows/rls.yml

  # Formatting, generated-type freshness, and schemas/-vs-migrations drift.
  # ci.yml triggers on `pull_request`, but `npm run deploy` pushes the merge
  # straight to `main`, so without this these checks never ran on the path that
  # actually reaches production — the same gap staging.yml closed for `dev`.
  # Unlike staging, this one gates: a drift or a formatting slip stops the
  # migration and the deploy rather than being reported after the fact.
  repo-checks:
    uses: ./.github/workflows/ci.yml

  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    # Only run this if tests were successful
    needs: [unit-tests, playwright, locale-validation, rls-tests, repo-checks]

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds, exhausting the shared rate limit and failing a job
      # before any test runs. Pinning also stops CI drifting ahead of local.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      # A bad migration is the likeliest cause of data loss and the one moment you
      # know is coming. Recording the append-only watermarks here makes "restore to
      # just before the deploy" a precise instruction: wall-clock cannot express it
      # when user activity and the deploy interleave.
      - name: Record the pre-migration restore point
        env:
          DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "PRODUCTION_DB_URL not set; skipping the pre-migration restore point" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marks=$(DB_URL="$DB_URL" ./supabase/dr/psql.sh -tAc "
            select 'audit_log=' || coalesce((select max(seq) from public.audit_log), 0)
                || ' token_events=' || coalesce((select max(seq) from public.token_events), 0)
                || ' transactions=' || coalesce((select max(seq) from public.transactions), 0)")
          {
            echo "### Pre-migration restore point"
            echo
            echo "Deploy: \`${{ github.sha }}\`"
            echo
            echo '```'
            echo "$marks"
            echo '```'
            echo
            echo 'To undo a bad migration: restore the most recent nightly backup, load the'
            echo 'tails up to this point, and replay to these watermarks (RECOVERY.md § Restoring).'
          } >> "$GITHUB_STEP_SUMMARY"

      # Refuse to push over migrations applied to production but absent from the repo.
      - name: Guard against divergent remote migrations
        run: |
          set -euo pipefail
          supabase migration list --linked > /tmp/migrations.txt || true
          cat /tmp/migrations.txt
          if grep -qE '^\s*\|\s+[0-9]{14}\s+\|' /tmp/migrations.txt; then
            echo "::error::production has migrations this repository does not. Reconcile before pushing."
            exit 1
          fi

      - run: supabase db push
      # Edge functions are NOT deployed by `db push`. Without this step a schema change
      # that depends on new function behavior lands while the deployed function is stale —
      # which fails quietly, since pg_net swallows the resulting error and mail simply
      # stops arriving. Deploy them in the same job so schema and functions never drift.
      - run: supabase functions deploy resend
      - run: supabase functions deploy remind

  vercel:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # Only deploy after tests pass and migrations are applied
    needs: [unit-tests, playwright, locale-validation, rls-tests, repo-checks, migrate]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install --global vercel@latest
        name: Install Vercel CLI

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        name: Pull Vercel environment

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        name: Build project

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        name: Deploy to Vercel production
