<!doctype html>
<!--
  Supabase auth template: magic link / email OTP sign-in.
  Hand-authored to mirror supabase/functions/_shared/emailShell.ts.
  IMPORTANT: keep the literal "code: {{ .Token }}" contiguous (no tags between
  "code:" and the token) — the login flow and the Playwright suite extract the
  OTP with /code:\s*(\d{6})/ from this email. See src/routes/login.ts.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light only" />
		<title>Your Reciprocal Reviews sign-in code</title>
	</head>
	<body style="margin: 0; padding: 0; background-color: #e1eff2;">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #e1eff2; padding: 24px 0;">
			<tr>
				<td align="center">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background-color: #ffffff; border: 1px solid #bbbbbb; border-radius: 8px; overflow: hidden; font-family: 'Quicksand', 'Josefin Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
						<tr>
							<td style="background-color: #007284; padding: 20px 32px;">
								<a href="https://reciprocal.reviews" style="color: #ffffff; font-size: 20px; font-weight: 700; text-decoration: none;">Reciprocal Reviews</a>
							</td>
						</tr>
						<tr>
							<td style="padding: 32px; color: #111111; font-size: 15px; line-height: 1.5;">
								<p style="margin: 0 0 16px 0;">Sign in to Reciprocal Reviews by entering this one-time code:</p>
								<p style="margin: 0 0 24px 0; font-size: 24px; font-weight: 700; color: #007284;">code: {{ .Token }}</p>
								<p style="margin: 0 0 16px 0;">Or follow this link to sign in directly:</p>
								<p style="margin: 0 0 16px 0;"><a href="{{ .ConfirmationURL }}" style="color: #007284;">Sign in to Reciprocal Reviews</a></p>
								<p style="margin: 0;">If you didn't request this, you can safely ignore this email.</p>
							</td>
						</tr>
						<tr>
							<td style="padding: 20px 32px; border-top: 1px solid #bbbbbb; color: #888888; font-size: 12px; line-height: 1.5;">
								This is an automated email sent by Reciprocal Reviews.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
