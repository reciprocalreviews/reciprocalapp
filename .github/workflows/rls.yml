name: RLS Tests

on:
  # Run as its own check on pull requests,
  pull_request:
  # allow the deploy workflows to call it,
  workflow_call:
  # and allow manual runs.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds, exhausting the shared rate limit and failing a job
      # before any test runs. Pinning also stops CI drifting ahead of local.
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      # The RLS tests (pg_prove via `supabase test db`) connect straight to
      # Postgres on 54322, so we boot only the db and the auth container. Auth
      # (gotrue) is kept because its startup migrations create the auth.users
      # table that the test fixtures and seed.sql insert into; everything else
      # (PostgREST, Kong, Realtime, Studio, edge runtime, etc.) is unused here.
      - name: Start Supabase (Postgres + auth only)
        run: supabase start --exclude storage-api,imgproxy,logflare,supavisor,vector,edge-runtime,kong,postgrest,realtime,studio,postgres-meta,mailpit

      # The backup drill runs this same suite against a restore of production, so a
      # test that counts every row of an event instead of the rows it wrote passes
      # here and fails there (2026-11-01). Committed noise makes it fail here first.
      - name: Load ambient production-like emails
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/_helpers/ambient_emails.psql

      - name: Run pgTAP RLS tests
        run: supabase test db
