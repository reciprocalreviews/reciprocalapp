name: Deploy to Staging

on:
  push:
    branches: ['dev']
  workflow_dispatch:

jobs:
  unit-tests:
    uses: ./.github/workflows/vitest.yml

  locale-validation:
    uses: ./.github/workflows/locales.yml

  playwright:
    uses: ./.github/workflows/playwright.yml
    secrets:
      TEST_ENV: ${{ secrets.TEST_ENV }}

  rls-tests:
    uses: ./.github/workflows/rls.yml

  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    # Staging is a throwaway test target, so deploy is intentionally NOT gated on
    # the tests — they still run (in parallel, for signal) but a red e2e/unit/rls
    # run won't block the preview. Production (production.yml) keeps the full gate.
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`. With `latest`, setup-cli resolves the release
      # through the GitHub API on every job; a dev push and a main merge fire ~10
      # of those within seconds, exhausting the shared rate limit and failing a job
      # before any test runs. Pinning also stops CI drifting ahead of local.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      # Edge functions are NOT deployed by `db push`. Without this step a schema change
      # that depends on new function behavior lands while the deployed function is stale —
      # which fails quietly, since pg_net swallows the resulting error and mail simply
      # stops arriving. Deploy them in the same job so schema and functions never drift.
      - run: supabase functions deploy resend
      - run: supabase functions deploy remind

  vercel:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # Deploy after migrations are applied. Not gated on tests (see migrate above);
    # we still order after migrate so schema changes land before the code.
    needs: [migrate]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install --global vercel@latest
        name: Install Vercel CLI

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        name: Pull Vercel environment

      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        name: Build project

      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        name: Deploy to Vercel preview
